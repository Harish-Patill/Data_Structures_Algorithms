name: Update README with Practice Questions
on:
  push:
    paths:
      - 'questions.txt'
jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Compile sync program
        run: gcc -o sync_readme scripts/sync_readme.c

      - name: Inject questions.txt into README
        run: ./sync_readme

      - name: Commit and push updated README
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: auto-update README from questions.txt"